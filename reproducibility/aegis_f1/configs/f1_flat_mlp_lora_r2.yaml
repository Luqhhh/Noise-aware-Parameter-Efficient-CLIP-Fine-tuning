# Low-learning-rate continuation of the fixed epoch-3 MLP-LoRA candidate.
# The inherited attention LoRA stays frozen. Only the all-depth rank-4 MLP
# LoRA factors and classifier continue training in this independent run.
project:
  experiment_id: F1_FLAT_MLP_LORA_R2_FP32
  seed: 42
  stage: preliminary

data:
  train_csv: ../artifacts/stages/preliminary/seed42/train.csv
  val_csv: ../artifacts/stages/preliminary/seed42/val.csv
  class_mapping: ../artifacts/stages/preliminary/seed42/class_to_idx.json
  train_root: ../../../train
  test_root: ../../../test
  train_augmentation: weak_rrc_flip
  external_data: false
  test_usage: inference_only
  expected_official_train_samples: 103218
  expected_test_samples: 24967

features:
  tensor_path: ../artifacts/stages/preliminary/features/clip_vit_b32_openai/features.pt
  paths_path: ../artifacts/stages/preliminary/features/clip_vit_b32_openai/image_paths.json
  manifest_path: ../artifacts/stages/preliminary/features/clip_vit_b32_openai/manifest.json

model:
  backbone: ViT-B/32
  pretrained: openai
  num_classes: 500
  feature_dim: 512
  peft_mode: visual_lora_mlp_lora
  use_cached_training: false
  lora_last_n_blocks: 12
  lora_rank: 8
  lora_alpha: 8.0
  lora_adapt_qv: true
  lora_adapt_out: true
  mlp_lora_last_n_blocks: 12
  mlp_lora_rank: 4
  mlp_lora_alpha: 4.0

trust:
  enabled: true
  bundle_path: ../artifacts/trust/cvt_v1.pt
  weighting_start_epoch: 1
  correction_start_epoch: 1
  minimum_sample_weight: 0.6
  selection_threshold: 0.60
  rejected_sample_weight: 0.0
  anchor_threshold: 0.80
  gradient_projection:
    enabled: false
    start_epoch: 1
    interval: 8
    minimum_anchor_samples: 8

loss:
  name: gce
  gce_q: 0.5
  epsilon: 1.0e-7
  ce_warmup_epochs: 0
  class_prior_adjustment_tau: 0.0
  mixup_alpha: 0.0
  mixup_probability: 0.0
  feature_distillation_weight: 2.0
  adaptive_cap:
    enabled: false

train:
  device: cuda
  deterministic: true
  # The independent AMP attempt failed closed on an infinite first-step
  # visual gradient. Native fp32 is retained for the valid continuation.
  amp: false
  epochs: 3
  schedule_epochs: 12
  batch_size: 32
  num_workers: 4
  prefetch_factor: 1
  loader_timeout: 120
  pin_memory: true
  head_lr: 0.0000005
  head_weight_decay: 0.0001
  backbone_lr: 0.00001
  backbone_weight_decay: 0.0
  lr_warmup_epochs: 0
  max_grad_norm: 1.0
  early_stop_patience: 0
  init_checkpoint: ../outputs/F1_FLAT_MLP_LORA_FP32/seed42/checkpoints/epoch_3.pt
  require_lineage_for_init_checkpoint: true

lineage:
  enabled: true
  parent_experiment_id: F1_FLAT_MLP_LORA_FP32
  parent_train_csv: ../artifacts/stages/preliminary/seed42/train.csv
  parent_val_csv: ../artifacts/stages/preliminary/seed42/val.csv
  require_same_train: true
  require_same_val: true

promotion:
  # Platform accuracy is the only promotion judge. Local metrics remain
  # anomaly diagnostics and must not suppress a valid fixed-epoch package.
  minimum_selector_gain: -1.0
  minimum_raw_micro_gain: -1.0
  maximum_mean_feature_drift: 1.0
  required_predicted_class_count: 500

evaluation:
  batch_size: 128
  inference_batch_size: 128
  selector_metric: clean_core_micro
  clean_core_threshold: 0.70
  measure_flip_consistency: true
  drift_budget: 0.01
  drift_penalty: 2.0

output:
  root: ../outputs
