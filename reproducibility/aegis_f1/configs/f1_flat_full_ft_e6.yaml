# Full visual-tower fine-tune continued from F1_FLAT_FULL_FT_R3MS epoch 3 to
# 6 epochs. Same noise-protection bundle as the LoRA lineage; conv1 and
# positional embeddings stay frozen. Local metrics were still improving at
# epoch 3 (raw 79.23%, clean-core 91.94%), so this variant probes whether
# longer full-finetune continues to help before platform feedback arrives.
project:
  experiment_id: F1_FLAT_FULL_FT_R3MS_E6
  seed: 42
  stage: preliminary

data:
  train_csv: ../artifacts/stages/preliminary/final_full_train.csv
  val_csv: ../artifacts/stages/preliminary/seed42/val.csv
  class_mapping: ../artifacts/stages/preliminary/seed42/class_to_idx.json
  train_root: ../../../train
  test_root: ../../../test
  train_augmentation: weak_rrc_flip
  external_data: false
  test_usage: inference_only
  expected_official_train_samples: 103218
  expected_test_samples: 24967
  validation_overlap_with_training: true

features:
  tensor_path: ../artifacts/stages/preliminary/features/clip_vit_b32_openai/features.pt
  paths_path: ../artifacts/stages/preliminary/features/clip_vit_b32_openai/image_paths.json
  manifest_path: ../artifacts/stages/preliminary/features/clip_vit_b32_openai/manifest.json

model:
  backbone: ViT-B/32
  pretrained: openai
  num_classes: 500
  feature_dim: 512
  peft_mode: full_finetune
  use_cached_training: false

trust:
  enabled: true
  bundle_path: ../artifacts/trust/selftrain_r2_teacher_v3_multiscale.pt
  weighting_start_epoch: 1
  correction_start_epoch: 1
  minimum_sample_weight: 0.6
  selection_threshold: 0.60
  rejected_sample_weight: 0.0
  anchor_threshold: 0.80
  gradient_projection:
    enabled: false
    start_epoch: 1
    interval: 8
    minimum_anchor_samples: 8

loss:
  name: gce
  gce_q: 0.5
  epsilon: 1.0e-7
  ce_warmup_epochs: 0
  class_prior_adjustment_tau: 0.0
  mixup_alpha: 0.0
  mixup_probability: 0.0
  feature_distillation_weight: 2.0
  adaptive_cap:
    enabled: false

train:
  device: cuda
  deterministic: true
  amp: false
  epochs: 6
  schedule_epochs: 18
  batch_size: 32
  num_workers: 4
  prefetch_factor: 1
  loader_timeout: 120
  pin_memory: true
  head_lr: 0.00000015
  head_weight_decay: 0.0001
  backbone_lr: 0.000003
  backbone_weight_decay: 0.0
  lr_warmup_epochs: 0
  max_grad_norm: 1.0
  early_stop_patience: 0
  init_checkpoint: ../outputs/F1_FLAT_FULL_FT_R3MS/seed42/checkpoints/best.pt
  require_lineage_for_init_checkpoint: true

lineage:
  enabled: true
  parent_experiment_id: F1_FLAT_MLP_LORA_SELFTRAIN_R3_MULTISCALE_FP32
  parent_train_csv: ../artifacts/stages/preliminary/final_full_train.csv
  parent_val_csv: ../artifacts/stages/preliminary/seed42/val.csv
  require_same_train: false
  require_same_val: true
  allow_parent_val_in_child_train: true
  allow_parent_train_in_child_val: true

promotion:
  minimum_selector_gain: -1.0
  minimum_raw_micro_gain: -1.0
  maximum_mean_feature_drift: 1.0
  required_predicted_class_count: 500

evaluation:
  batch_size: 128
  inference_batch_size: 128
  selector_metric: clean_core_micro
  selection_policy: last_epoch
  clean_core_threshold: 0.70
  measure_flip_consistency: true
  drift_budget: 0.01
  drift_penalty: 2.0

output:
  root: ../outputs
