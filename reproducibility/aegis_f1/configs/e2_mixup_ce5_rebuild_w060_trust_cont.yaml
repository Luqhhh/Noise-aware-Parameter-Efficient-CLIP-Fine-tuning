# Trust-aware E2 parent: same recipe as E2_MIXUP_CE5_REBUILD (frozen CLIP, CE5
# warmup, GCE q=0.5, MixUp 0.2, 50 epochs) but with the cvt_v1 trust bundle
# enabled for the WHOLE parent stage.
#
# CONT variant: continuous trust weighting WITHOUT hard sample drop.
# The dropping variant (threshold 0.60) lost 2.5pp clean-core vs the noise-naive
# E2 (0.7835 vs 0.8088) because dropping 27.5% of samples destroyed coverage.
# This variant keeps ALL samples at continuous weight 0.6+0.4*clean in [0.62,1.0],
# starts weighting/correction AFTER the 5-epoch CE warmup, so the parent keeps
# full-data coverage while down-weighting noisy samples.
project:
  experiment_id: E2_MIXUP_CE5_REBUILD_W060_TRUST_CONT
  seed: 42
  stage: preliminary

data:
  train_csv: ../artifacts/stages/preliminary/seed42/train.csv
  val_csv: ../artifacts/stages/preliminary/seed42/val.csv
  class_mapping: ../artifacts/stages/preliminary/seed42/class_to_idx.json
  train_root: ../../../train
  test_root: ../../../test
  external_data: false
  test_usage: inference_only
  expected_official_train_samples: 103218
  expected_test_samples: 24967

features:
  tensor_path: ../artifacts/stages/preliminary/features/clip_vit_b32_openai/features.pt
  paths_path: ../artifacts/stages/preliminary/features/clip_vit_b32_openai/image_paths.json
  manifest_path: ../artifacts/stages/preliminary/features/clip_vit_b32_openai/manifest.json

model:
  backbone: ViT-B/32
  pretrained: openai
  num_classes: 500
  feature_dim: 512
  peft_mode: frozen
  use_cached_training: true

trust:
  enabled: true
  bundle_path: ../artifacts/trust/cvt_v1.pt
  weighting_start_epoch: 6
  correction_start_epoch: 5
  minimum_sample_weight: 0.6
  anchor_threshold: 0.80
  gradient_projection:
    enabled: false
    start_epoch: 1
    interval: 4
    minimum_anchor_samples: 8

loss:
  name: gce
  gce_q: 0.5
  epsilon: 1.0e-7
  ce_warmup_epochs: 5
  class_prior_adjustment_tau: 0.0
  mixup_alpha: 0.2
  mixup_probability: 0.2
  feature_distillation_weight: 0.0
  adaptive_cap:
    enabled: false

train:
  device: cuda
  deterministic: true
  amp: true
  epochs: 50
  batch_size: 128
  num_workers: 8
  prefetch_factor: 1
  loader_timeout: 120
  pin_memory: true
  head_lr: 0.005
  head_weight_decay: 0.0001
  backbone_lr: 0.0
  backbone_weight_decay: 0.0
  lr_warmup_epochs: 2
  max_grad_norm: 1.0
  early_stop_patience: 10

evaluation:
  batch_size: 256
  inference_batch_size: 128
  selector_metric: raw_micro
  drift_budget: 0.01
  drift_penalty: 0.5

output:
  root: ../outputs
