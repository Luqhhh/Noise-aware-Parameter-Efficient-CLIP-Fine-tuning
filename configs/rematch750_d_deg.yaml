# D 轴：训练侧成像退化增广。
#
# 除 `data.train_degradation` 外，本文件逐字镜像 configs/rematch750_ft.yaml ——
# 同 seed 42、同 8 轮、同 batch 32、同 full_finetune、同 RM-LP init checkpoint、
# 同 GCE/MixUp 配方。因此 D_DEG 与 RM_FT 的差**只归因于退化增广这一个变量**。
#
# 强度取自已批准的设计（JPEG 重编码 / 高斯模糊 / 高斯噪声），三类覆盖
# **压缩块效应、镜头模糊、传感器噪声** —— 都是「来源特有的成像统计」，
# 而不是已被推理侧探针证伪的干净几何（那只有 0.17–0.31pp）。
project:
  experiment_id: D_DEG
  stage: repechage
  seed: 42
  data_version: '20260921'
data:
  train_root: ../train
  test_root: ../test
  train_csv: ../artifacts/stages/repechage/20260921/train_dev.csv
  val_csv: ../artifacts/stages/repechage/20260921/val_dev.csv
  class_mapping: ../artifacts/stages/repechage/20260921/class_to_idx.json
  dataset_manifest: ../artifacts/stages/repechage/20260921/dataset_manifest.json
  train_augmentation: weak_rrc_flip
  train_degradation:
    jpeg:
      quality: [30, 95]
      p: 0.5
    gaussian_blur:
      sigma: [0.3, 1.2]
      p: 0.3
    gaussian_noise:
      sigma: [2.0, 10.0]
      p: 0.3
  expected_official_train_samples: 148695
  expected_test_samples: 37444
  validation_overlap_with_training: false
  external_data: false
  test_usage: inference_only
features:
  tensor_path: ../artifacts/stages/repechage/20260921/features/features.pt
  paths_path: ../artifacts/stages/repechage/20260921/features/image_paths.json
  manifest_path: ../artifacts/stages/repechage/20260921/features/manifest.json
model:
  backbone: ViT-B/32
  pretrained: openai
  num_classes: 750
  feature_dim: 512
  peft_mode: full_finetune
  use_cached_training: false
  official_checkpoint: ~/.cache/clip/ViT-B-32.pt
trust:
  enabled: false
longtail:
  sampler_mode: none
  loss_reweighting: none
  balanced_softmax_tau: 0.0
loss:
  name: gce
  gce_q: 0.5
  ce_warmup_epochs: 2
  mixup_alpha: 0.0
  mixup_probability: 0.0
  feature_distillation_weight: 2.0
train:
  device: cuda
  deterministic: true
  amp: true
  epochs: 8
  schedule_epochs: 8
  batch_size: 32
  num_workers: 4
  loader_timeout: 120
  pin_memory: true
  head_lr: 0.0001
  head_weight_decay: 0.0001
  backbone_lr: 3.0e-06
  backbone_weight_decay: 0.0001
  lr_warmup_epochs: 0
  max_grad_norm: 1.0
  early_stop_patience: 0
  save_epoch_checkpoints: false
  init_checkpoint: ../outputs/rematch750/RM_LP/seed42/checkpoints/best.pt
  amp_initial_scale: 128.0
  amp_growth_interval: 1000000000
  require_finite_gradients: true
  log_every_steps: 200
evaluation:
  batch_size: 128
  inference_batch_size: 128
  selector_metric: raw_macro
  selection_policy: best_selector
  interval_epochs: 2
  tiebreak_metric: raw_micro
  drift_penalty: 0.0
  measure_flip_consistency: false
  record_initial: false
  evaluate_initial_checkpoint: false
output:
  root: ../outputs/rematch750
diagnostics:
  longtail:
    enabled: true
