# RM_FULL: the V3 winning recipe re-run on all 148,695 official training images.
#
# This is a clone of configs/rematch750_v3_b1024_e16_lr4.yaml differing only in the
# data-scope fields enumerated in docs/rematch750_full_ft_prereg_20260923.md 3 (train
# csv, full_training, overlap declaration, selection policy, tiebreak, init_checkpoint,
# experiment_id, output root).  The point of the run is a paired data-scope comparison
# against the V3/RM-FT platform baseline, so every other field (mechanism, epoch count,
# cosine horizon, LR, batch, AMP, augmentation, selector metric) must stay untouched.
# tests/test_rematch750_full_ft.py enforces this by diffing the two configs.
#
# init_checkpoint must be the full-data LP: checkpoint_binding() binds train_csv_sha256,
# so the dev-data RM-LP is rejected as a parent for a full-data FT.
#
# Bind an idle physical NPU before execution; this template is not executable.
data:
  class_mapping: ../../artifacts/stages/repechage/20260921_npu/class_to_idx.json
  dataset_manifest: ../../artifacts/stages/repechage/20260921_npu/dataset_manifest.json
  expected_official_train_samples: 148695
  expected_test_samples: 37444
  external_data: false
  test_root: ../../test
  test_usage: inference_only
  train_augmentation: weak_rrc_flip
  train_csv: ../../artifacts/stages/repechage/20260921_npu/full_train.csv
  train_root: ../../train
  val_csv: ../../artifacts/stages/repechage/20260921_npu/val_dev.csv
  validation_overlap_with_training: true
diagnostics:
  longtail:
    enabled: true
evaluation:
  batch_size: 128
  drift_penalty: 0.0
  evaluate_initial_checkpoint: false
  inference_batch_size: 128
  interval_epochs: 2
  measure_flip_consistency: false
  record_initial: false
  selection_policy: last_epoch
  selector_metric: raw_macro
  tiebreak_metric: null
features:
  manifest_path: ../../artifacts/stages/repechage/20260921_npu/features/manifest.json
  paths_path: ../../artifacts/stages/repechage/20260921_npu/features/image_paths.json
  tensor_path: ../../artifacts/stages/repechage/20260921_npu/features/features.pt
longtail:
  balanced_softmax_tau: 0.0
  loss_reweighting: none
  sampler_mode: none
loss:
  ce_warmup_epochs: 2
  feature_distillation_weight: 2.0
  gce_q: 0.5
  mixup_alpha: 0.0
  mixup_probability: 0.0
  name: gce
model:
  backbone: ViT-B/32
  feature_dim: 512
  num_classes: 750
  official_checkpoint: ~/.cache/clip/ViT-B-32.pt
  peft_mode: full_finetune
  pretrained: openai
  use_cached_training: false
output:
  root: ../../outputs/clairvoyanttt/rematch750_full_ft
project:
  data_version: '20260921'
  experiment_id: RM_FULL
  full_training: true
  seed: 42
  stage: repechage
train:
  amp: true
  amp_growth_interval: 1000000000
  amp_initial_scale: 128.0
  backbone_lr: 1.2e-05
  backbone_weight_decay: 0.0001
  batch_size: 1024
  deterministic: true
  device: npu:UNASSIGNED
  early_stop_patience: 0
  epochs: 16
  head_lr: 0.0004
  head_weight_decay: 0.0001
  init_checkpoint: ../../outputs/clairvoyanttt/rematch750_full_ft/RM_FULL_LP/seed42/checkpoints/best.pt
  loader_timeout: 120
  log_every_steps: 20
  lr_warmup_epochs: 0
  max_grad_norm: 1.0
  num_workers: 40
  pin_memory: true
  require_finite_gradients: true
  save_epoch_checkpoints: false
  schedule_epochs: 16
  prefetch_factor: 4
  npu_pin_memory: true
  optimizer_impl: npu_fused_adamw
  gradient_norm_impl: foreach
trust:
  enabled: false
